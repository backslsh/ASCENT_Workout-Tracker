name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Ascend.xcodeproj \
            -scheme Ascend \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ascend.app Payload/
          ls Payload/Ascend.app/PlugIns || echo "::warning::No widget extension found in the app bundle"

          # Ad-hoc sign so the App Group entitlement travels with the IPA.
          # Sideloadly re-signs everything with your Apple ID and reads these entitlements.
          APPEX="Payload/Ascend.app/PlugIns/AscendWidgets.appex"
          if [ -d "$APPEX" ]; then
            codesign --force --sign - --generate-entitlement-der --entitlements Support/AscendWidgets.entitlements "$APPEX" \
              || echo "::warning::Could not ad-hoc sign the widget extension"
          fi
          codesign --force --sign - --generate-entitlement-der --entitlements Support/Ascend.entitlements Payload/Ascend.app \
            || echo "::warning::Could not ad-hoc sign the app"

          zip -qry Ascend.ipa Payload
          ls -lh Ascend.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ascend-ipa
          path: Ascend.ipa
          retention-days: 30
