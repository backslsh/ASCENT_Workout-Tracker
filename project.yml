name: Ascend
options:
  bundleIdPrefix: com.ascend
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Ascend:
    type: application
    platform: iOS
    sources:
      - path: Ascend
      - path: Shared
    dependencies:
      - target: AscendWidgets
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ascend.fitness
        PRODUCT_NAME: Ascend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
    entitlements:
      path: Support/Ascend.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ascend.fitness
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ascend
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ascend.fitness
            CFBundleURLSchemes:
              - ascend
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  AscendWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ascend.fitness.widgets
        PRODUCT_NAME: AscendWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        SKIP_INSTALL: YES
    entitlements:
      path: Support/AscendWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ascend.fitness
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Ascend
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
